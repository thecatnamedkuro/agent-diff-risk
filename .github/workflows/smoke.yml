name: smoke
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - run: python -m agent_diff_risk.cli --diff-file examples.diff --fail-on critical || test $? -eq 2
